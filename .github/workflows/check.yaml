name: Check
on:
  workflow_call:
jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y clang-format-15
      - run: cmake -B build -S . -D WEBVIEW_BUILD=OFF -D WEBVIEW_CLANG_FORMAT_EXE=clang-format-15
      - run: cmake --build build --target webview_format_check

  amalgamate:
    runs-on: ${{ matrix.image }}
    strategy:
      matrix:
        image:
          - macos-14
          - ubuntu-22.04
          - windows-2022
        python-version:
#          - "3.9"
#          - "3.10"
#          - "3.11"
          - "3.12"
        include:
          - image: macos-14
            clang-format-exe: clang-format
          - image: ubuntu-22.04
            clang-format-exe: clang-format-15
          - image: windows-2022
            clang-format-exe: clang-format
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          apt: gcc-12 g++-12
          msys-pacboy: clang-tools-extra:p
          webkitgtk-api: 6.0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang-format-15

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install clang-format

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Generate amalgamated header
        run: |
          python3 amalgamate.py \
            --clang-format-exe "${{ matrix.clang-format-exe }}" \
            --search ../../core/include \
            --output test/generated/webview_amalgamation.h \
            ../../core/src/
        shell: bash
        working-directory: scripts/amalgamate

      - name: Test (header-only library)
        run: |
          cmake -B build-header -S .
          cmake --build build-header
          ./build-header/webview_amalgamation_test
        shell: bash
        working-directory: scripts/amalgamate/test

      - name: Test (static library)
        run: |
          cmake -B build-static -S .
          cmake --build build-static
          ./build-static/webview_amalgamation_test
        shell: bash
        working-directory: scripts/amalgamate/test

      - name: Test (shared library)
        run: |
          cmake -B build-shared -S .
          cmake --build build-shared
          ./build-shared/webview_amalgamation_test
        shell: bash
        working-directory: scripts/amalgamate/test
