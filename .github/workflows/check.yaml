name: Check
on:
  workflow_call:
jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y clang-format-15
      - run: cmake -B build -S . -D WEBVIEW_BUILD=OFF -D WEBVIEW_CLANG_FORMAT_EXE=clang-format-15
      - run: cmake --build build --target webview_format_check

  amalgamate:
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - macos-14
          - ubuntu-22.04
          - windows-2022
        python-version:
#          - "3.9"
#          - "3.10"
#          - "3.11"
          - "3.12"
        config:
          - { type: header, static: OFF, shared: OFF }
          - { type: shared, static: OFF, shared: ON }
          - { type: static, static: ON,  shared: OFF }
        include:
          - image: macos-14
            clang-format-exe: clang-format
          - image: ubuntu-22.04
            clang-format-exe: clang-format-15
            test-wrapper-cmd: xvfb-run
          - image: windows-2022
            clang-format-exe: clang-format
    steps:
      - uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup-env
        with:
          apt: gcc-12 g++-12
          msys-pacboy: clang-tools-extra:p
          webkitgtk-api: "6.0"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang-format-15

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install clang-format

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Generate amalgamated header
        run: |
          python3 amalgamate.py \
            --clang-format-exe "${{ matrix.clang-format-exe }}" \
            --search ../../core/include \
            --output test/generated/webview_amalgamation.h \
            ../../core/src/
        shell: bash
        working-directory: scripts/amalgamate

      - name: Test (${{ matrix.config.type }})
        run: |
          cmake -B build-header -S . -D WEBVIEW_BUILD=OFF \
            -D "WEBVIEW_BUILD_STATIC_LIBRARY=${{ matrix.config.static }}" \
            -D "WEBVIEW_BUILD_SHARED_LIBRARY=${{ matrix.config.shared }}"
          cmake --build "${build_dir}"
          test_cmd=()
          if [[ ! -z "${{ matrix.test-wrapper-cmd }}" ]]; then
            test_cmd+=("${{ matrix.test-wrapper-cmd }}")
          fi
          test_cmd+=("${build_dir}/webview_amalgamation_test")
          "${test_cmd[@]}"
        shell: bash
        working-directory: scripts/amalgamate/test
